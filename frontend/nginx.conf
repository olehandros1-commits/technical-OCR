server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSE / API proxy. In production split into a separate origin and
    # configure CORS via EXTRACTOR_CORS_ALLOW on the API.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_buffering off;          # SSE
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 24h;
    }

    # NEVER cache index.html. Vite emits hashed bundle names
    # (index-XXXX.js), so the HTML is the only stale-risk surface --
    # if the browser caches it, the user keeps loading deleted bundle
    # paths after a deploy. This is what caused the "Lost connection"
    # ghost behaviour during the QA cycle.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed assets are immutable -- cache them aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # Same no-cache for the SPA shell.
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri /index.html;
    }
}
