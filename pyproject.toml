[project]
name = "dobs"
version = "0.1.0"
description = "Bank statement extraction agent with deterministic reconciliation"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.6.0",
    "click>=8.1.7",
    "pdfplumber>=0.11.0",
    "pikepdf>=8.0.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "dishka>=1.4.0",
    "aiofiles>=24.1.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
ocr     = ["pytesseract>=0.3.10", "pdf2image>=1.17.0", "pillow>=10.0.0"]
ollama  = ["ollama>=0.4.0"]
redis   = ["redis>=5.0.0"]
queue   = ["arq>=0.26.0", "redis>=5.0.0"]
otel    = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-instrumentation-redis>=0.46b0",
]
metrics = ["prometheus-fastapi-instrumentator>=7.0.0"]
sentry  = ["sentry-sdk[fastapi]>=2.0.0"]
streamlit = ["streamlit>=1.36.0", "pandas>=2.2.0", "requests>=2.32.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "hypothesis>=6.100.0",
    "pip-audit>=2.7.0",
    "types-aiofiles",
]
all = [
    "dobs[ocr,ollama,redis,queue,otel,metrics,sentry,streamlit]",
]

[project.scripts]
dobs = "dobs.presentation.cli.extract:main"
dobs-ui = "dobs.presentation.streamlit.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "slow: tests that take > 1s",
    "integration: hits real Redis / external services",
]

[tool.coverage.run]
branch = true
source = ["src/dobs"]
omit = [
    "src/dobs/presentation/streamlit/*",
    "src/dobs/infrastructure/adapters/llm/anthropic_backend.py",
    "src/dobs/infrastructure/adapters/llm/ollama_backend.py",
    "src/dobs/infrastructure/adapters/replay/demo_replay.py",
    "src/dobs/main/worker.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pdf2image.*", "pytesseract.*", "ollama.*", "anthropic.*",
    "pikepdf.*", "pdfplumber.*", "openpyxl.*", "streamlit.*",
    "arq.*", "PIL.*", "redis.*", "structlog.*",
    "opentelemetry.*", "prometheus_fastapi_instrumentator", "sentry_sdk.*",
    "click.*", "rich.*", "pandas.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["examples", "frontend"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
    "S",
    "PERF",
    "RUF",
]
ignore = [
    "E501",
    "S101", "S110", "S112", "S301", "S311", "S603", "S607", "S608",
    "B008", "B905",
    "UP040",
    "SIM102", "SIM103", "SIM105", "SIM113", "SIM117", "SIM211",
    "RUF005", "RUF006", "RUF007", "RUF012", "RUF046",
    "ASYNC109", "ASYNC240",
    "PERF102", "PERF203", "PERF401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC", "B", "SIM", "RUF", "E402"]
"src/dobs/presentation/streamlit/app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
