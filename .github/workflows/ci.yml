name: CI

on:
  push:
    branches: [main, async-refactor]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXTRACTOR_DEMO_REPLAY: "1"
  ANTHROPIC_API_KEY: "fake-for-tests"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install 3.12
      - run: uv sync --extra dev --extra ocr --extra redis --extra ollama --extra queue --extra otel --extra metrics --extra sentry --extra streamlit

      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy src/dobs/

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install ${{ matrix.python }}
      - run: uv sync --extra dev --extra ocr --extra redis --extra ollama --extra queue --extra streamlit --python ${{ matrix.python }}

      - run: uv run pytest tests/ -n auto --cov --cov-report=xml --cov-report=term

      - if: matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run pip-audit --strict --ignore-vuln GHSA-4xh5-x5gv-qwph || true

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, tests]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - run: docker compose -f docker/docker-compose.yml build api worker ui

      - name: Boot stack
        run: |
          docker compose -f docker/docker-compose.yml up -d
          for i in 1 2 3 4 5 6; do
            sleep 5
            curl -fsS http://localhost:8000/api/v1/health/live && exit 0 || true
          done
          echo "API did not come up"
          docker compose -f docker/docker-compose.yml logs api
          exit 1

      - name: Smoke extract
        run: |
          curl -fsS -X POST http://localhost:8000/api/v1/extraction/extract \
            -F "pdf=@Binder2_Redacted.pdf" \
            -F "tier=balanced" \
            -o /tmp/extract.json
          python3 -c "import json,sys; r=json.load(open('/tmp/extract.json'))['results']; rec=sum(1 for x in r if (x.get('_reconciliation') or {}).get('ok')); assert len(r)==10 and rec==10, f'got {len(r)} stmts {rec} reconciled'; print(f'OK: 10/10 reconciled')"

      - name: Teardown
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
